<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title><link rel="stylesheet" href="style.css">
</head>
<body class="newtab-page" data-newtab-background="classic">
<main class="newtab-inner" id="newtabMain">
  <div class="newtab-brand"><img src="icon_round.png" alt="NeoFind logo"><span>New Tab</span></div>
  <form id="webSearch" class="newtab-search">
    <div id="newtabSearchEnginePicker" class="search-engine-picker">
      <button id="newtabSearchEngineButton" class="search-engine-button" type="button" aria-haspopup="menu" aria-expanded="false" title="Choose search engine" aria-label="Choose search engine">
        <span id="newtabSearchEngineLogo" class="search-engine-logo google-logo" aria-hidden="true">G</span>
        <span class="search-engine-chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="newtabSearchEngineMenu" class="search-engine-menu hidden" role="menu" aria-label="Search in">
        <div class="search-engine-menu-title">Search in:</div>
        <button class="search-engine-option" type="button" role="menuitemradio" aria-checked="true" data-engine="google"><img class="search-engine-logo" src="logos/google.svg" alt=""><span>Google</span><span class="search-engine-default">Default</span><span class="search-engine-check">✓</span></button>
        <button class="search-engine-option" type="button" role="menuitemradio" aria-checked="false" data-engine="neofind"><img class="search-engine-logo" src="logos/neofind.svg" alt=""><span>NeoFind</span><span class="search-engine-default"></span><span class="search-engine-check">✓</span></button>
        <button class="search-engine-option" type="button" role="menuitemradio" aria-checked="false" data-engine="bing"><img class="search-engine-logo" src="logos/bing.svg" alt=""><span>Bing</span><span class="search-engine-default"></span><span class="search-engine-check">✓</span></button>
        <button class="search-engine-option" type="button" role="menuitemradio" aria-checked="false" data-engine="duckduckgo"><img class="search-engine-logo" src="logos/duckduckgo.svg" alt=""><span>DuckDuckGo</span><span class="search-engine-default"></span><span class="search-engine-check">✓</span></button>
        <button class="search-engine-option" type="button" role="menuitemradio" aria-checked="false" data-engine="wikipedia"><img class="search-engine-logo" src="logos/wikipedia.svg" alt=""><span>Wikipedia</span><span class="search-engine-default"></span><span class="search-engine-check">✓</span></button>
        <button class="search-engine-option" type="button" role="menuitemradio" aria-checked="false" data-engine="ulululu"><img class="search-engine-logo" src="logos/ulululu.svg" alt=""><span>ulululu</span><span class="search-engine-default"></span><span class="search-engine-check">✓</span></button>
      </div>
    </div>
    <input id="searchText" type="search" placeholder="Search in web" autocomplete="off" autofocus>
    <button type="submit" id="newtabSearchSubmit" title="Search" aria-label="Search">↵</button>
  </form>
  <div class="newtab-section-heading"><h2 class="newtab-section-title">Your shortcuts</h2><span class="newtab-section-caption">Recently visited</span></div>
  <section id="recentSites" class="newtab-sites" aria-live="polite"></section>
</main>
<main id="announcementsRoot" class="announcements-shell" hidden>
  <header class="announcements-header">
    <div><p class="announcements-eyebrow">NEOFIND CONNECT</p><h1>Announcements</h1><p>Things sent to this device from another NeoFind Browser.</p></div>
    <div class="announcements-header-actions"><button id="refreshAnnouncements" class="announcements-refresh" type="button">Refresh</button></div>
  </header>
  <section id="announcementsList" class="announcements-list" aria-live="polite"><div class="announcements-empty">Loading your inbox…</div></section>
</main>
<script>
(function(){
  const pageMode = new URLSearchParams(location.search).get("view");
  const announcementsMode = pageMode === "announcements";
  if (announcementsMode) {
    document.title = "Announcements";
    document.getElementById("newtabMain").hidden = true;
    document.getElementById("announcementsRoot").hidden = false;
    const list = document.getElementById("announcementsList");
    function addText(parent, tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = String(value || "");
      parent.append(node);
      return node;
    }
    window.renderNeoAnnouncements = function(result) {
      list.replaceChildren();
      if (!result || !result.ok) {
        addText(list, "div", "announcements-empty", result && result.message || "Could not connect to the device inbox.");
        return;
      }
      const messages = Array.isArray(result.messages) ? result.messages : [];
      if (!messages.length) {
        addText(list, "div", "announcements-empty", "No announcements yet. Items sent to this device will appear here.");
        return;
      }
      messages.forEach(message => {
        const card = document.createElement("article");
        card.className = "announcement-card";
        if (message.isSystem) {
          const verified = document.createElement("div");
          verified.className = "system-announcement-brand";
          const logo = document.createElement("img");
          logo.src = "icon_round.png";
          logo.alt = "NeoFind";
          const brand = document.createElement("div");
          const name = document.createElement("strong");
          name.textContent = "NeoFind";
          const badge = document.createElement("span");
          badge.className = "system-verified-badge";
          badge.textContent = "✓ Verified";
          brand.append(name, badge);
          verified.append(logo, brand);
          card.append(verified);
        }
        const top = document.createElement("div");
        top.className = "announcement-card-top";
        addText(top, "span", "announcement-kind", String(message.kind || "item").toUpperCase());
        const date = message.createdAt ? new Date(message.createdAt) : null;
        addText(top, "time", "announcement-date", date && !Number.isNaN(date.getTime()) ? date.toLocaleString() : "");
        card.append(top);
        addText(card, "h2", "announcement-title", message.title || "Shared item");
        if (message.kind === "text") {
          addText(card, "pre", "announcement-text", message.text || "");
        } else {
          const target = String(message.url || message.text || "");
          let validUrl = "";
          try {
            const parsed = new URL(target);
            if (parsed.protocol === "https:" || parsed.protocol === "http:") validUrl = parsed.href;
          } catch {}
          if (["image", "video", "audio"].includes(message.kind)) {
            addText(card, "p", "announcement-description", message.kind[0].toUpperCase() + message.kind.slice(1) + " shared from another device.");
          }
          if (validUrl) {
            const link = document.createElement("a");
            link.className = "announcement-link";
            link.href = validUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = message.kind === "page" ? "Open shared page" : message.kind === "image" ? "Open image" : message.kind === "video" ? "Open video" : message.kind === "audio" ? "Open audio" : (message.title || validUrl);
            card.append(link);
          } else {
            addText(card, "pre", "announcement-text", message.text || "No preview available.");
          }
        }
        addText(card, "p", "announcement-from", message.isSystem ? "From NeoFind" : "From device " + String(message.fromCode || "unknown"));
        list.append(card);
      });
    };
    document.getElementById("refreshAnnouncements").addEventListener("click", () => location.reload());
    return;
  }
  const input=document.getElementById("searchText");
  const picker=document.getElementById("newtabSearchEnginePicker");
  const button=document.getElementById("newtabSearchEngineButton");
  const menu=document.getElementById("newtabSearchEngineMenu");
  const logo=document.getElementById("newtabSearchEngineLogo");
  const options=Array.from(menu.querySelectorAll(".search-engine-option"));
  const providers={
    google:{label:"Google",logoUrl:"logos/google.svg",search:q=>"https://www.google.com/search?q="+encodeURIComponent(q)},
    neofind:{label:"NeoFind",logoUrl:"logos/neofind.svg",search:q=>"https://neofind.pl/app/?q="+encodeURIComponent(q)},
    bing:{label:"Bing",logoUrl:"logos/bing.svg",search:q=>"https://www.bing.com/search?q="+encodeURIComponent(q)},
    duckduckgo:{label:"DuckDuckGo",logoUrl:"logos/duckduckgo.svg",search:q=>"https://duckduckgo.com/?q="+encodeURIComponent(q)},
    wikipedia:{label:"Wikipedia",logoUrl:"logos/wikipedia.svg",search:q=>"https://en.wikipedia.org/w/index.php?search="+encodeURIComponent(q)},
    ulululu:{label:"ulululu",logoUrl:"logos/ulululu.svg",search:q=>"https://ulululu.neofind.local/?q="+encodeURIComponent(q)}
  };
  let provider=localStorage.getItem("neoBrowserSearchEngine")||"google";
  if(!providers[provider])provider="google";
  function renderProvider(){
    const p=providers[provider];
    logo.className="search-engine-logo";
    logo.src=p.logoUrl;
    logo.alt="";
    button.title="Search in: "+p.label;
    button.setAttribute("aria-label","Search in: "+p.label);
    options.forEach(option=>option.setAttribute("aria-checked",String(option.dataset.engine===provider)));
  }
  function closeMenu(){menu.classList.add("hidden");button.setAttribute("aria-expanded","false");}
  button.addEventListener("click",()=>{
    const opening=menu.classList.contains("hidden");
    menu.classList.toggle("hidden",!opening);
    button.setAttribute("aria-expanded",String(opening));
  });
  options.forEach(option=>option.addEventListener("click",()=>{
    if(!providers[option.dataset.engine])return;
    provider=option.dataset.engine;
    localStorage.setItem("neoBrowserSearchEngine",provider);
    renderProvider();
    closeMenu();
    input.focus();
  }));
  document.addEventListener("click",event=>{if(!event.target.closest("#newtabSearchEnginePicker"))closeMenu();});
  document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMenu();});
  document.getElementById("webSearch").addEventListener("submit",event=>{
    event.preventDefault();
    const query=input.value.trim();
    if(query){const target=providers[provider].search(query);if(provider==="ulululu"&&window.neoBrowser&&window.neoBrowser.navigate)window.neoBrowser.navigate(target);else location.href=target;}
  });
  renderProvider();
  const backgroundKey="neofind.newTabBackground";
  function applyBackground(){
    const allowed=["classic","mountains","sunset","beach","snow","sky","halloween"];
    const selected=allowed.includes(localStorage.getItem(backgroundKey))?localStorage.getItem(backgroundKey):"classic";
    document.body.dataset.newtabBackground=selected;
  }
  applyBackground();
  window.addEventListener("storage",event=>{if(event.key===backgroundKey)applyBackground();});
  const historyKey="neofind.browserHistory";
  function getHistory(){try{const v=JSON.parse(localStorage.getItem(historyKey)||"[]");return Array.isArray(v)?v:[];}catch{return[];}}
  async function render(){const host=document.getElementById("recentSites");let rows=[];try{if(window.neoBrowser&&window.neoBrowser.getRecentSites)rows=await window.neoBrowser.getRecentSites();}catch{}if(!rows.length)rows=getHistory();const seen=new Set();rows=rows.filter(x=>x&&/^https?:/i.test(x.url||"")&&!seen.has(x.url)&&seen.add(x.url)).slice(0,10);host.innerHTML="";if(!rows.length){host.innerHTML='<div class="newtab-empty">Your recently opened websites will appear here.</div>';return;}for(const row of rows){let url;try{url=new URL(row.url);}catch{continue;}const a=document.createElement("a");a.className="newtab-site";a.href=row.url;a.title=row.title||url.hostname;const img=document.createElement("img");img.loading="lazy";img.alt="";img.src="https://www.google.com/s2/favicons?domain="+encodeURIComponent(url.hostname)+"&sz=64";img.onerror=()=>{img.src="icon_round.png";};const label=document.createElement("span");label.textContent=row.title||url.hostname;a.append(img,label);host.append(a);}}
  render();
})();
</script>
</body></html>
