name: NeoFind Economy Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/neo-economy-suite]
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check index.js
      - run: node --check ../neo-social.js
      - run: node --test
