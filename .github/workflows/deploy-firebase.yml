name: Deploy NeoFind Firebase backend

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Functions dependencies
        run: npm install --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEOFIND_F8213 }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Cloud Functions and Firestore rules
        run: firebase deploy --only functions,firestore:rules --project neofind-f8213 --non-interactive
