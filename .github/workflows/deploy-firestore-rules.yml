name: Deploy NeoFind Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - black-friday-custom-shops
    paths:
      - "firestore.rules"
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEOFIND_F8213 }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Cloud Functions (XP and Shop)
        run: firebase deploy --only functions --project neofind-f8213 --non-interactive
      - name: Deploy Firestore rules
        continue-on-error: true
        run: firebase deploy --only firestore:rules --project neofind-f8213 --non-interactive
