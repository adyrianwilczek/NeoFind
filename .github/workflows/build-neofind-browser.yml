name: Build NeoFind Browser for Windows

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-neofind-browser.yml"
    tags:
      - "neofind-browser-v*"
  workflow_dispatch:

concurrency:
  group: neofind-browser-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoFind-Windows-Installer
          path: desktop/dist/NeoFind-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NeoFind Browser ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/dist/NeoFind-Setup.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          generate_release_notes: true
          prerelease: true
