name: Deploy NeoFind XP Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-xp-function.yml"

permissions:
  contents: read

concurrency:
  group: neofind-xp-deploy
  cancel-in-progress: false

jobs:
  deploy-award-xp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEOFIND_F8213 }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Deploy only the XP function
        run: firebase deploy --only functions:awardXp --project neofind-f8213 --non-interactive
